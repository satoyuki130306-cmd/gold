<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ポイントを金に変え、現物への交換を体験するアプリの体験デモ"><title>EPOS GOLD</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23182647'/%3E%3Cpath d='M8 23V9h4l4 7 4-7h4v14h-4v-7l-4 6-4-6v7z' fill='white'/%3E%3C/svg%3E"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;font-size:16px;color:#282828;background:#f2f3f5;--red:#c72c38;--gold:#836120;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #d77b82;outline-offset:3px}p{line-height:1.7;margin:8px 0}h1{font-size:25px;line-height:1.5;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:17px;line-height:1.5;margin:0 0 8px}small,.muted{font-size:14px;color:#6b6b6b}.demo{padding:8px 16px;text-align:center;background:#fff;font-size:12px;color:#666;border-bottom:1px solid var(--line)}header{max-width:1000px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{background:none;text-align:left;padding:0;font-size:24px;letter-spacing:.05em;color:var(--red);font-weight:800}.brand small{display:block;font-size:12px;font-weight:500;color:#767676;letter-spacing:.08em;margin-top:4px}.member{font-size:12px;color:var(--gold);background:#f6ecd5;border:1px solid #e4d3ae;padding:7px 10px;border-radius:4px}.shell{max-width:1000px;margin:auto;padding:0 24px 125px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 20px}.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}.card{border-radius:15px;background:#fff;padding:24px;border:1px solid var(--line);margin-bottom:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.amount{font-size:42px;line-height:1.2;font-weight:700;letter-spacing:-.045em;margin:14px 0}.amount span{font-size:18px;font-weight:500;letter-spacing:0;margin-left:6px}.paydate{font-size:14px;padding:14px 0 0;border-top:1px solid var(--line)}.labeltop{font-size:14px;color:#555}.badge{font-size:12px;padding:4px 8px;background:#f4f4f4;border-radius:4px;color:#666}.point-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px}.point-value{font-size:32px;font-weight:700;margin:8px 0 0}.point-value small{font-size:16px;font-weight:500}.btn{border-radius:7px;background:var(--red);color:#fff;font-weight:700;padding:14px 18px;min-height:48px}.btn.secondary{background:white;border:1px solid var(--red);color:var(--red)}.btn.gold{background:var(--gold);color:#fff}.btn.ghost{background:#f5f5f5;color:#555}.full{width:100%;margin-top:16px}.shortcut{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 20px}.shortcut button{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:88px;padding:14px 8px;font-size:14px;font-weight:600}.shortcut span{display:block;font-size:13px;color:var(--red);font-weight:700;margin-bottom:8px}.gold-card{background:#fffaf0;border-color:#e5d4ac}.gold-card .labeltop{color:var(--gold)}.gold-card .amount{color:#71541c}.gold-label{font-size:12px;letter-spacing:.13em;font-weight:700;color:var(--gold)}.progress{height:9px;background:#e9dfcc;border-radius:6px;overflow:hidden;margin:18px 0 14px}.progress i{display:block;height:100%;background:#ae8438;border-radius:6px}.progress-note{font-size:14px;display:flex;justify-content:space-between;gap:12px}.note{font-size:12px;color:#757575;line-height:1.7;margin:18px 0 0}.note a{color:#666}.section-title{font-size:17px;font-weight:700;margin:24px 0 14px}.notice{border-left:3px solid var(--red);background:#fff;padding:16px 18px;font-size:14px;margin-bottom:18px}.ledger{padding:16px 0;border-top:1px solid var(--line);font-size:14px}.ledger:first-child{border:0}.ledger p{font-size:12px;color:#777;margin:5px 0 0}.list-button{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;padding:20px 0;background:none;border-top:1px solid var(--line);font-size:16px}.list-button strong{font-size:14px;color:var(--red)}.label{display:block;font-size:14px;margin:22px 0 10px}input{width:100%;border:1px solid #ccc;background:white;border-radius:7px;padding:14px;color:#282828}input[type=number]{font-size:22px}.presets{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.presets button{background:#f5f5f5;padding:11px 14px;min-height:44px;font-size:14px;border-radius:5px}.preview{background:#f6f6f6;border-radius:10px;padding:18px;margin-top:20px}.preview b{font-size:26px;color:var(--gold)}.success{background:#edf6ef;color:#296741;border-radius:10px;padding:18px;margin:18px 0;font-size:14px}.collection-label{font-size:14px;color:var(--gold);padding:12px 14px;border:1px solid #e0cea6;border-radius:6px;display:inline-block;background:#fffaf0}.two-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.two-stat div{padding:16px;background:#f6f6f6;border-radius:9px}.two-stat b{display:block;font-size:22px;margin:8px 0}.sticky{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:5}.sticky button{background:transparent;color:#666;font-size:14px;min-width:92px;min-height:56px;padding:8px 10px}.sticky span{display:block;font-size:17px;font-weight:700;margin-bottom:4px}.sticky button.active{color:var(--red);font-weight:700}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;background:#292929;color:#fff;padding:14px 20px;border-radius:9px;z-index:20;font-size:14px}.hide{display:none!important}dialog{border:0;color:#282828;padding:28px;border-radius:16px;width:calc(100% - 32px);max-width:440px;max-height:90vh;overflow:auto}dialog::backdrop{background:#0007}dialog .row{align-items:stretch}dialog .row button{flex:1}.single{max-width:650px;margin:auto}.history-value{font-weight:700;white-space:nowrap;color:var(--gold)}
@media(max-width:700px){header{padding:18px 16px}.shell{padding:0 16px 120px}.home-grid{grid-template-columns:1fr;gap:0}.card{padding:22px 20px}.amount{font-size:39px}.point-value{font-size:29px}.point-row{gap:12px}.point-row .btn{padding:12px;font-size:14px}.sticky{gap:0;justify-content:space-around;padding-left:4px;padding-right:4px}.sticky button{min-width:0;flex:1;font-size:14px;padding:8px 3px}.sticky span{font-size:16px}.member{font-size:12px}.brand{font-size:23px}.shortcut button{font-size:14px}.heading{margin-bottom:18px}.single{max-width:none}}
</style><link rel="stylesheet" href="./lab.css"></head><body data-concept="epos-gold"><div class="demo">EPOS GOLD 企画デモ · 公式アプリ・実際の口座とは連動しません</div><header><button class="brand" onclick="view('home')">EPOS GOLD<small>APP CONCEPT</small></button><span class="member">デモ会員 · GOLD</span></header><main id="app" class="shell" aria-label="EPOS GOLD"></main><nav id="bottom" class="sticky" aria-label="画面切替"></nav><div id="toast" class="toast hide" role="status"></div><dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><div id="confirmText"></div><p class="note">体験デモです。実際のポイント・資産・決済は動きません。</p><div class="row" style="margin-top:24px"><button class="btn ghost" onclick="cancelAction()">キャンセル</button><button class="btn" onclick="finishAction()">交換を体験する</button></div></dialog><script>
const state={view:'home',points:12400,goldMg:820,exchanged:false,pending:null,ledger:[{label:'ポイントから交換',date:'デモ開始時の残高',mg:820,points:0}]};
const $=id=>document.getElementById(id);const grams=mg=>(mg/1000).toFixed(3);let timer;
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hide');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hide'),3200)}
function view(v){state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function heading(text){return `<div class="heading"><h1>${text}</h1><span class="badge">デモ</span></div>`}
function progress(){return `<div class="progress" role="progressbar" aria-label="1gコインへの進捗" aria-valuenow="${Math.min(100,state.goldMg/10)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,state.goldMg/10)}%"></i></div><div class="progress-note"><span>1gコインまで</span><b>${state.goldMg>=1000?'交換できます':'あと '+grams(1000-state.goldMg)+' g'}</b></div>`}
function balance(){return `<section class="card gold-card"><div class="row"><span class="gold-label">YOUR GOLD</span><span class="badge">企画機能</span></div><p class="labeltop" style="margin-top:18px">貯めた金の残高</p><p class="amount">${grams(state.goldMg)}<span>g</span></p>${progress()}<button class="btn gold full" onclick="view('convert')">ポイントを金に交換</button><button class="btn secondary full" onclick="view('reward')">現物への交換を見る</button></section>`}
function historyRows(){return [...state.ledger].reverse().map(e=>`<div class="ledger row"><div><b>${e.label}</b><p>${e.date}${e.points?' · '+e.points.toLocaleString()+' pt':''}</p></div><span class="history-value">${e.mg>0?'+':'−'}${grams(Math.abs(e.mg))} g</span></div>`).join('')}
function recentRow(){const e=state.ledger.at(-1);return `<div class="ledger row"><div><b>${e.label}</b><p>${e.date}</p></div><span class="history-value">${e.mg>0?'+':'−'}${grams(Math.abs(e.mg))} g</span></div>`}
function render(){
 const selected=state.view==='convert'?'points':state.view;
 $('bottom').innerHTML=[['home','⌂','ホーム'],['points','P','ポイント'],['gold','g','金の残高'],['reward','◇','現物交換'],['history','≡','履歴']].map(([v,icon,label])=>`<button class="${selected===v?'active':''}" onclick="view('${v}')" ${selected===v?'aria-current="page"':''}><span aria-hidden="true">${icon}</span>${label}</button>`).join('');
 $('app').innerHTML=screen();
}
function screen(){
 if(state.view==='home')return heading('ホーム')+`<div class="home-grid"><section><section class="card"><div class="row"><span class="labeltop">10月のお支払予定額</span><span class="badge">サンプル</span></div><p class="amount">48,620<span>円</span></p><div class="paydate row"><span>お支払日</span><b>10月27日</b></div><p class="note">請求情報は架空のサンプルです。</p></section><section class="card point-row"><div><span class="labeltop">エポスポイント</span><p class="point-value">${state.points.toLocaleString()} <small>pt</small></p></div><button class="btn secondary" onclick="view('points')">みる・つかう</button></section><div class="shortcut"><button onclick="view('convert')"><span>POINT</span>金に交換</button><button onclick="view('reward')"><span>COLLECTION</span>現物に交換</button><button onclick="view('history')"><span>HISTORY</span>交換履歴</button></div><div class="notice"><b>ポイントの新しい使い道</b><p>いつものポイントを、少しずつ金に。目標まで貯まったら、コラボコインへの交換を選べます。</p></div></section><section>${balance()}<section class="card"><h2>最近の金の交換</h2>${recentRow()}<button class="btn ghost full" onclick="view('history')">履歴をすべて見る</button></section></section></div>`;
 if(state.view==='points')return `<div class="single">${heading('ポイントをみる・つかう')}<section class="card"><span class="labeltop">利用可能ポイント</span><p class="amount">${state.points.toLocaleString()}<span>pt</span></p><p class="muted">デモ残高</p><button class="list-button" onclick="view('convert')"><span>金に交換する</span><strong>企画機能</strong></button><button class="list-button" onclick="view('history')"><span>金への交換履歴</span><strong>確認</strong></button></section><div class="notice"><b>使う楽しみから、貯める楽しみへ。</b><p>ポイントを重さに変えて積み重ねます。</p></div><p class="note">エポスアプリのポイント確認・交換の構成を参考にした企画デモです。金への交換は現行サービスではありません。</p></div>`;
 if(state.view==='gold')return `<div class="single">${heading('金の残高')}${balance()}<section class="card"><h2>現物交換の目標</h2><div class="two-stat"><div><small>コラボコイン</small><b>1.000 g</b></div><div><small>達成率</small><b>${Math.min(100,Math.floor(state.goldMg/10))}%</b></div></div><p class="note">デモ残高はこの画面内だけで変化します。</p></section></div>`;
 if(state.view==='convert')return `<div class="single">${heading('ポイントを金に交換')}<section class="card"><div class="row"><span class="labeltop">利用可能ポイント</span><b>${state.points.toLocaleString()} pt</b></div><label class="label" for="amount">交換するポイント（100 pt単位）</label><input id="amount" inputmode="numeric" type="number" min="100" max="${state.points}" step="100" value="${Math.min(4000,state.points)}" oninput="updateAmount()"><div class="presets">${[1000,4000].map(n=>`<button ${state.points<n?'disabled':''} onclick="setAmount(${n})">${n.toLocaleString()} pt</button>`).join('')}<button ${state.points<100?'disabled':''} onclick="setAmount(${Math.floor(state.points/100)*100})">すべて</button></div><div class="preview row"><span>受け取る金</span><b id="estimate">${(Math.min(4000,state.points)/20000).toFixed(3)} g</b></div><div class="ledger row" style="margin-top:18px"><span>現在の金残高</span><b>${grams(state.goldMg)} g</b></div><button class="btn full" onclick="convert()" ${state.points<100?'disabled':''}>交換内容を確認</button><p class="note">固定のデモ計算：1 pt＝1円、金1g＝20,000円。実際の金相場や交換条件ではありません。</p></section></div>`;
 if(state.view==='reward')return `<div class="single">${heading('現物に交換')}<section class="card"><span class="collection-label">COLLECTION · コラボ純金コイン</span><h2 style="margin-top:22px">好きな作品を、持っておける金に。</h2><p class="muted">作品・デザインは未定の企画イメージです。</p><div class="ledger row" style="margin-top:20px"><span>交換に必要な金</span><b>1.000 g</b></div><div class="ledger row"><span>現在の金残高</span><b>${grams(state.goldMg)} g</b></div><div class="ledger row"><span>加工・配送費（デモ）</span><b>3,000円</b></div>${progress()}${state.exchanged?'<div class="success">現物への交換体験が完了しました。決済・発送は行われません。</div>':`<button class="btn gold full" ${state.goldMg<1000?'disabled':''} onclick="confirmReward()">現物交換の内容を確認</button>`}<button class="btn secondary full" onclick="view('convert')">ポイントを金に交換する</button><p class="note">加工・配送費や交換条件は、企画検討用のサンプルです。</p></section></div>`;
 if(state.view==='history')return `<div class="single">${heading('金の交換履歴')}<section class="card">${historyRows()}</section><p class="note">すべてデモ上の記録です。実際の取引・ポイント交換ではありません。</p></div>`;
 return '';
}
function setAmount(n){$('amount').value=n;updateAmount()}
function updateAmount(){const n=Number($('amount').value);$('estimate').textContent=Number.isFinite(n)&&n>=0?(n/20000).toFixed(3)+' g':'—'}
function convert(){const n=Number($('amount').value);if(!Number.isInteger(n)||n<100||n%100||n>state.points){toast('100 pt単位で、利用可能ポイント内の金額を入力してください');return;}state.pending={kind:'points',points:n};$('confirmTitle').textContent='金への交換内容を確認';$('confirmText').innerHTML=`<div class="ledger row"><span>使うポイント</span><b>${n.toLocaleString()} pt</b></div><div class="ledger row"><span>受け取る金</span><b>${(n/20000).toFixed(3)} g</b></div><div class="ledger row"><span>交換後の金残高</span><b>${grams(state.goldMg+n/20)} g</b></div><p class="note">金1g＝20,000円で計算したデモです。</p>`;$('confirm').showModal()}
function confirmReward(){if(state.goldMg<1000||state.exchanged)return;state.pending={kind:'reward'};$('confirmTitle').textContent='現物交換の内容を確認';$('confirmText').innerHTML=`<div class="ledger row"><span>コラボ純金コイン</span><b>1点 / 1.000 g</b></div><div class="ledger row"><span>加工・配送費（デモ）</span><b>3,000円</b></div><div class="ledger row"><span>交換後の金残高</span><b>${grams(state.goldMg-1000)} g</b></div>`;$('confirm').showModal()}
function cancelAction(){state.pending=null;$('confirm').close()}
function finishAction(){const action=state.pending;if(!action)return;const date='今回の体験';if(action.kind==='points'){const n=action.points;if(n>state.points)return;state.points-=n;state.goldMg+=n/20;state.ledger.push({label:'ポイントから金へ交換',date,points:n,mg:n/20});}else if(action.kind==='reward'){if(state.goldMg<1000||state.exchanged)return;state.goldMg-=1000;state.exchanged=true;state.ledger.push({label:'コラボ純金コインに交換',date,points:0,mg:-1000});}state.pending=null;$('confirm').close();render();toast(action.kind==='points'?'金のデモ残高に反映しました':'現物への交換体験が完了しました')}
$('confirm').addEventListener('cancel',()=>{state.pending=null});
render();
</script><script src="./lab.js"></script></body></html>
